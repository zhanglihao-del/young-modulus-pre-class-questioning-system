<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>杨氏模量｜课前预习问答</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body {
            color: #333;
            padding: 16px;
            min-height: 100vh;
            background: #f5f7fa;
        }
        .container{max-width:900px;margin:0 auto;}
        .title{text-align:center;font-size:24px;color:#165DFF;margin-bottom:8px;font-weight:600;}
        .sub{text-align:center;color:#666;margin-bottom:24px;font-size:15px;}
        .card{background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
        .q-item{background:#f0f7ff;border-radius:8px;padding:14px;margin-bottom:12px;font-size:15px;color:#222;line-height:1.6;}
        .rand-btn {
            padding: 10px 18px;
            background: #165DFF;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 16px;
            font-size:15px;
            transition: background 0.2s ease;
        }
        .rand-btn:hover {
            background: #0f4cd1;
        }
        h3 {
            color: #1f2937;
            margin-bottom: 12px;
            font-size:18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">杨氏模量实验 课前预习提问系统</div>
        <div class="sub">预习自测 · 原理+数据处理+仪器技术文档综合题库</div>

        <div class="card">
            <h3>📋 课前思考题</h3>
            <button class="rand-btn" onclick="getRandomQuestions()">🎲 随机出5道课前思考题</button>
            <div id="questionBox"></div>
        </div>
    </div>

    <script>
        const questionBank = [
            // ========== 一、基础公式、力学原理 ==========
            "写出本实验杨氏模量计算公式 E = 8gLH/(πd²Dk)，并逐一说明式中每个物理量的名称、测量工具与标准单位。",
            "推导光杠杆放大倍数公式，并解释放大倍数与光杠杆臂长D、镜面到标尺距离H的关系。",
            "杨氏模量E的物理意义是什么？它反映了固体材料的何种力学性质？",
            "应力、应变的定义表达式分别是什么？简述胡克定律与杨氏模量的关联。",
            "单位换算：1 GPa、1 MPa、1 N/mm² 三者之间如何相互换算？",
            "结合金属丝横截面积公式与光杠杆原理，分步推导公式中系数8的由来。",
            "光杠杆镜面发生微小偏转θ角时，标尺读数偏移量Δn与偏转角存在怎样的近似关系？该近似成立的条件是什么？",
            "实验为何必须保证金属丝始终处于弹性形变区间？若超出弹性极限会出现什么现象？",

            // ========== 二、数据处理：逐差法、线性拟合、不确定度 ==========
            "本实验测量标尺读数为何优先使用逐差法处理数据？逐差法相比直接求平均有哪些优势？",
            "简述逐差法的使用前提，若测量6组等间隔载荷数据，如何分组进行逐差计算？",
            "实验中以载荷F为横坐标、标尺读数n为纵坐标做线性拟合，写出拟合斜率k的表达式，并说明其物理含义。",
            "线性拟合得到的截距不为零，分析产生该现象的主要实验原因。",
            "若F-n曲线明显偏离直线，试分析金属丝或实验装置可能出现的问题。",
            "区分A类不确定度和B类不确定度，本实验中哪些物理量需要计算A类不确定度？",
            "仪器误差属于哪一类不确定度？螺旋测微器、米尺、标尺的仪器误差限值分别是多少？",
            "根据间接测量量不确定度传递公式，推导杨氏模量E的相对不确定度表达式。",
            "分析金属丝直径d的测量误差，为何对最终杨氏模量结果影响最大？",
            "扩展不确定度U与合成标准不确定度u_c的关系是什么？取包含因子k=2时代表什么置信概率？",
            "简述用最小二乘法进行一元线性回归的数据处理完整步骤。",

            // ========== 三、仪器结构、技术参数（取自仪器技术文档） ==========
            "整套杨氏模量测定仪由哪几大核心部件组成？分别说明各部件的作用。",
            "简述光杠杆组件的内部结构，包含镜面、前足、后足三部分各自的安装要求与功能。",
            "根据仪器技术参数，说明本装置配套望远镜的放大倍率、有效观测视场范围。",
            "仪器配套标尺的量程、最小分度值分别是多少？读数时估读位数要求是什么？",
            "本实验装置标配金属丝的标称长度、常用直径规格范围分别是多少？",
            "简述砝码组的标称单块质量、总加载量程，以及仪器设计的最大安全加载载荷。",
            "光杠杆标准臂长D的出厂标称值是多少？使用前是否需要重新实测标定？",
            "杨氏模量底座采用水平调节螺钉，说明底座调平的技术要求及判断标准。",
            "望远镜镜筒的俯仰调节机构、左右微调机构，在技术文档中规定的调节范围是多少？",
            "仪器支架、夹头组件的材质是什么？金属丝上下夹头的锁紧结构原理是什么？",

            // ========== 四、标准操作规程（仪器文档规范步骤） ==========
            "按照仪器技术规程，简述杨氏模量实验整机安装与调试的完整流程。",
            "依据设备操作规范，说明望远镜与标尺的同轴等高调节步骤与判定标准。",
            "光杠杆安装的官方规范：后足、前足分别放置位置，以及镜面垂直度调节要求。",
            "加载砝码的标准操作流程是什么？为何规程要求逐级加载、逐级卸载，禁止一次性增减砝码？",
            "按照仪器使用文档，简述螺旋测微器测量金属丝直径的标准操作流程与读数规则。",
            "实验开机/使用前，依据设备规范需要做哪些预检项目？",
            "实验结束后的仪器归位、清洁、收纳，按照技术文档有哪些硬性要求？",
            "更换待测金属丝时，遵循设备规程的拆装步骤是什么？如何避免夹头划伤金属丝？",

            // ========== 五、仪器故障排查、异常现象（维修/运维文档内容） ==========
            "依据仪器故障手册：望远镜视野内完全看不到标尺像，列举3种官方排查方案。",
            "加载砝码后标尺读数持续漂移、无法稳定，结合设备结构分析故障点与处理方法。",
            "光杠杆镜面松动、偏转卡顿，属于仪器常见故障，说明危害及标准紧固维修方法。",
            "底座水平失准会带来哪些测量偏差？如何利用水平泡和调平螺钉快速修正？",
            "上下夹头夹持金属丝打滑，是设备常见问题，分析原因并给出规范处理方式。",
            "望远镜调焦旋钮失灵、镜筒无法伸缩，简述简易排查与报修条件。",
            "标尺刻度模糊、反光异常，按照设备维护要求如何处理？",
            "同一载荷下多次读数重复性差，从仪器机械结构角度分析主要故障原因。",

            // ========== 六、仪器标定、维护与保养（设备维保文档） ==========
            "根据仪器维保手册，说明杨氏模量装置的日常保养项目及周期。",
            "光杠杆臂长D、标尺零点、望远镜光路，仪器多久需要进行一次整机标定？",
            "金属丝属于易损件，维保文档中规定的更换判定标准是什么？",
            "设备长期闲置存放，按照技术要求需要做哪些防护措施？",
            "螺旋测微器零点偏移属于仪器系统误差，依据规范多久校验一次零点？",
            "仪器金属部件防锈、光学镜片防污的官方维护要求是什么？禁止哪些操作？",

            // ========== 七、综合拓展、误差分析、深度思考 ==========
            "增减砝码时，要求轻拿轻放且等待示数稳定，结合仪器结构分析该操作的原因。",
            "光杠杆装置安装时，为何技术规范要求镜面垂直于水平面、标尺保持竖直？",
            "使用螺旋测微器测量金属丝直径时，如何读取初读数（零点误差）？零点误差为正、负时如何修正测量值？",
            "螺旋测微器测量时，为何规程禁止过度旋转棘轮？会造成什么后果？",
            "更换不同粗细的同种金属丝，在相同载荷下，伸长量和杨氏模量会如何变化？",
            "加载和卸载过程中，同一载荷对应的标尺读数不一致（滞后现象），结合仪器与材料特性分析原因。",
            "若抬高光杠杆的支点高度，在其他条件不变时，光杠杆放大倍数如何变化？杨氏模量测量结果是否改变？",
            "假设实验中H测量偏大，结合公式分析最终计算出的杨氏模量E会偏大还是偏小？",
            "比较光杠杆法、千分表法测量微小形变，结合仪器结构说明两者优缺点。",
            "同一根金属丝，在不同温度下杨氏模量是否会改变？结合材料特性简述原因。",
            "为什么测量金属丝原长L时，不需要像测直径一样多次多点测量？",
            "结合不确定度与仪器精度，说明本实验中哪些部件/物理量需要优先保证测量精度。"
        ];

        function getRandomQuestions() {
            const box = document.getElementById("questionBox");
            box.innerHTML = "";
            // 数组随机洗牌
            const shuffleList = [...questionBank].sort(() => 0.5 - Math.random());
            // 选取前5道题目
            const selectList = shuffleList.slice(0, 5);

            selectList.forEach((item, idx) => {
                const div = document.createElement("div");
                div.className = "q-item";
                div.innerText = `${idx + 1}. ${item}`;
                box.appendChild(div);
            });
        }

        // 页面加载自动出题
        window.onload = getRandomQuestions;
    </script>
</body>
</html>
